# Cloudflare Pages configuration for Suhas Portfolio
# Updated: Fixed Terser dependency issue and optimized build for Cloudflare Pages
# - Switched to esbuild minification for better compatibility
# - Added proper environment configuration
# - Optimized build settings for production deployment

name = "suhas-portfolio"
compatibility_date = "2024-01-01"

[build]
command = "npm run build"
cwd = "."
watch_dir = "src"

[build.upload]
format = "service-worker"

# Environment variables for build
[env.production.vars]
NODE_ENV = "production"

# Build configuration
[site]
bucket = "./dist"
entry-point = "workers-site"